<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Phase Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
        canvas { border-radius: 20px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-auto">
    <div class="max-w-screen-2xl mx-auto">
        <header class="border-b border-zinc-800 bg-zinc-900 py-6 px-10 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-violet-500 rounded-2xl flex items-center justify-center text-2xl">M</div>
                <div>
                    <h1 class="title-font text-4xl font-semibold tracking-tighter">Molecular Phase Simulator</h1>
                    <p class="text-zinc-400 text-sm">Real-time physics • Fixed container • Instant temp control</p>
                </div>
            </div>
            <a href="#" onclick="resetSimulation()" class="flex items-center gap-x-2 px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-sm font-medium">RESET</a>
        </header>

        <div class="flex flex-col lg:flex-row gap-8 p-8 lg:p-12">
            <!-- Controls -->
            <div class="lg:w-80 bg-zinc-900 rounded-3xl p-8 border border-zinc-800 flex flex-col gap-8">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-zinc-500 mb-2">SUBSTANCE</label>
                    <select id="substance-select" class="w-full bg-zinc-800 border border-zinc-700 focus:border-cyan-400 rounded-2xl px-5 py-4 text-lg">
                        <option value="Water">Water (H₂O)</option>
                        <option value="Ethanol">Ethanol (C₂H₅OH)</option>
                        <option value="Carbon Dioxide">Carbon Dioxide (CO₂)</option>
                        <option value="Iron">Iron (Fe)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between text-xs uppercase tracking-widest text-zinc-500 mb-2">
                        <label>MOLECULES</label>
                        <span id="num-display" class="font-mono text-cyan-400">80</span>
                    </div>
                    <input type="range" id="num-slider" min="20" max="200" value="80" step="10" class="w-full accent-cyan-400">
                </div>

                <div>
                    <div class="flex justify-between text-xs uppercase tracking-widest text-zinc-500 mb-2">
                        <label>TEMPERATURE</label>
                        <span id="temp-val-slider" class="font-mono text-cyan-400">25.0 °C</span>
                    </div>
                    <input type="range" id="temp-slider" min="-100" max="300" value="25" step="0.5" class="w-full accent-cyan-400">
                </div>

                <div class="flex gap-4">
                    <button onclick="togglePause()" id="pause-btn"
                            class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-5 rounded-3xl font-medium flex items-center justify-center gap-x-3 text-lg">
                        <span id="pause-icon">❚❚</span>
                        <span id="pause-text">PAUSE</span>
                    </button>
                    <button onclick="resetSimulation()" class="flex-1 border border-zinc-700 hover:border-zinc-400 py-5 rounded-3xl font-medium text-zinc-400">RESET</button>
                </div>
            </div>

            <!-- Canvas -->
            <div class="flex-1 flex justify-center items-center">
                <div class="relative bg-zinc-900 p-6 rounded-3xl border border-zinc-800">
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-zinc-900 px-8 py-1 rounded-3xl border border-zinc-700 text-xs tracking-widest text-teal-400">CONTAINER</div>
                    <canvas id="canvas" width="720" height="480" class="bg-zinc-950 rounded-3xl"></canvas>
                    
                    <div id="phase-overlay" class="absolute bottom-8 left-1/2 -translate-x-1/2 px-8 py-3 rounded-3xl text-sm font-semibold flex items-center gap-x-3 shadow-xl">
                        <div id="phase-dot" class="w-4 h-4 rounded-full bg-teal-400"></div>
                        <span id="phase-name" class="text-lg">LIQUID</span>
                    </div>
                </div>
            </div>

            <!-- Metrics -->
            <div class="lg:w-80 bg-zinc-900 rounded-3xl p-8 border border-zinc-800 flex flex-col gap-6">
                <div class="text-xs uppercase tracking-widest text-zinc-500 mb-4">LIVE METRICS</div>
                <div class="bg-zinc-800 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">TEMPERATURE</div>
                    <div id="temp-val" class="text-5xl font-mono font-semibold mt-1">25.0</div>
                    <div class="text-xs text-zinc-500">°C</div>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">PRESSURE</div>
                    <div id="pressure-val" class="text-5xl font-mono font-semibold mt-1">1.00</div>
                    <div class="text-xs text-zinc-500">atm</div>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">PHASE</div>
                    <div id="phase-val" class="mt-3 inline-flex px-6 py-2 rounded-3xl text-xl font-semibold">LIQUID</div>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">SPECIFIC HEAT</div>
                    <div id="sh-val" class="text-4xl font-mono font-semibold mt-1">4.184</div>
                    <div class="text-xs text-zinc-500">J/g·K</div>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">TOTAL ENERGY</div>
                    <div id="energy-val" class="text-4xl font-mono font-semibold mt-1">62800</div>
                    <div class="text-xs text-zinc-500">J</div>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">MOLECULES</div>
                    <div id="molecules-val" class="text-5xl font-mono font-semibold mt-1">80</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = 720, H = 480;
        const R = 11;
        const LEFT = 50, RIGHT = W-50, TOP = 50, BOTTOM = H-50;

        let particles = [];
        let gravity = 0.18;
        let restitution = 0.95;          // increased for more energetic bounces
        let dragged = null;
        let mouseX = 0, mouseY = 0;

        let currentTemp = 25;
        let numMolecules = 80;
        let paused = false;

        const substances = {
            "Water": { melt: 0, boil: 100, sh: 4.184 },
            "Ethanol": { melt: -114, boil: 78, sh: 2.44 },
            "Carbon Dioxide": { melt: -78.5, boil: -56.6, sh: 0.846 },
            "Iron": { melt: 1538, boil: 2862, sh: 0.449 }
        };
        let substance = substances["Water"];

        const colors = { Solid: "#60a5fa", Liquid: "#2dd4bf", Gas: "#fb923c" };

        function getPhase(t) {
            return t < substance.melt ? "Solid" : t < substance.boil ? "Liquid" : "Gas";
        }

        function createParticle() {
            return {
                x: LEFT + R + Math.random() * (RIGHT - LEFT - 2*R),
                y: TOP + R + Math.random() * (BOTTOM - TOP - 2*R - 80),
                vx: (Math.random()-0.5)*4.5,   // higher base speed so changes are more visible
                vy: (Math.random()-0.5)*4.5
            };
        }

        function initParticles(n) {
            particles = [];
            for (let i = 0; i < n; i++) particles.push(createParticle());
        }

        function updateMoleculeCount(n) {
            if (n > numMolecules) {
                for (let i = 0; i < n - numMolecules; i++) particles.push(createParticle());
            } else {
                particles.length = n;
            }
            numMolecules = n;
            document.getElementById('num-display').textContent = n;
            document.getElementById('molecules-val').textContent = n;
        }

        function setTemperature(t) {
            const oldK = currentTemp + 273;
            const newK = Math.max(0.1, t + 273);
            if (particles.length) {
                const factor = Math.sqrt(newK / oldK);
                particles.forEach(p => {
                    p.vx *= factor;
                    p.vy *= factor;
                });
            }
            currentTemp = Math.max(-273, Math.min(3000, t));
            document.getElementById('temp-val-slider').textContent = currentTemp.toFixed(1) + " °C";
            document.getElementById('temp-val').textContent = currentTemp.toFixed(1);
        }

        function updateMetrics() {
            const phase = getPhase(currentTemp);
            const tempK = currentTemp + 273;
            const pressure = (numMolecules * tempK / 15000).toFixed(2);

            document.getElementById('pressure-val').textContent = pressure;
            const phaseEl = document.getElementById('phase-val');
            phaseEl.textContent = phase.toUpperCase();
            phaseEl.className = `mt-3 inline-flex px-6 py-2 rounded-3xl text-xl font-semibold ${
                phase==="Solid" ? "bg-blue-900 text-blue-300" : 
                phase==="Liquid" ? "bg-teal-900 text-teal-300" : "bg-orange-900 text-orange-300"
            }`;
            document.getElementById('sh-val').textContent = substance.sh.toFixed(3);
            document.getElementById('energy-val').textContent = Math.round(numMolecules * substance.sh * tempK * 12).toLocaleString();

            document.getElementById('phase-dot').style.backgroundColor = colors[phase];
            document.getElementById('phase-name').textContent = phase.toUpperCase();
        }

        function animate() {
            if (!paused) {
                const phase = getPhase(currentTemp);
                const g = (phase === "Gas") ? 0 : gravity;
                const damp = phase === "Solid" ? 0.84 : phase === "Liquid" ? 0.965 : 1.0;   // ← ZERO damping in gas = perfect energy conservation

                particles.forEach(p => {
                    if (p === dragged) return;
                    p.vy += g;
                    p.vx *= damp;
                    p.vy *= damp;
                    p.x += p.vx;
                    p.y += p.vy;

                    // Walls
                    if (p.x < LEFT + R) { p.x = LEFT + R; p.vx = -p.vx * restitution; }
                    if (p.x > RIGHT - R) { p.x = RIGHT - R; p.vx = -p.vx * restitution; }
                    if (p.y < TOP + R) { p.y = TOP + R; p.vy = -p.vy * restitution; }
                    if (p.y > BOTTOM - R) { p.y = BOTTOM - R; p.vy = -p.vy * (phase === "Solid" ? 0.3 : restitution); }
                });

                // Particle collisions - more bouncy
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i+1; j < particles.length; j++) {
                        const a = particles[i], b = particles[j];
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const d = Math.hypot(dx, dy);
                        if (d < 2*R && d > 0.01) {
                            const nx = dx/d, ny = dy/d;
                            let vel = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
                            if (vel > 0) continue;
                            const imp = -1.95 * vel;               // higher restitution
                            a.vx -= imp * nx * 0.5;
                            a.vy -= imp * ny * 0.5;
                            b.vx += imp * nx * 0.5;
                            b.vy += imp * ny * 0.5;
                            const overlap = 2*R - d;
                            a.x -= overlap * nx * 0.5;
                            a.y -= overlap * ny * 0.5;
                            b.x += overlap * nx * 0.5;
                            b.y += overlap * ny * 0.5;
                        }
                    }
                }
            }

            if (dragged) {
                dragged.x = mouseX;
                dragged.y = mouseY;
            }

            // Draw
            ctx.fillStyle = "#18181b";
            ctx.fillRect(0, 0, W, H);

            // Container
            ctx.strokeStyle = "#27272a"; ctx.lineWidth = 18;
            ctx.strokeRect(LEFT-8, TOP-8, RIGHT-LEFT+16, BOTTOM-TOP+16);
            ctx.strokeStyle = "#a1a1aa"; ctx.lineWidth = 6;
            ctx.strokeRect(LEFT, TOP, RIGHT-LEFT, BOTTOM-TOP);

            // Molecules
            const phase = getPhase(currentTemp);
            ctx.fillStyle = colors[phase];
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, R, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "rgba(255,255,255,0.35)";
                ctx.beginPath(); ctx.arc(p.x-4, p.y-4, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = colors[phase];
            });

            updateMetrics();
            requestAnimationFrame(animate);
        }

        // Mouse
        canvas.addEventListener('mousedown', e => {
            const r = canvas.getBoundingClientRect();
            mouseX = e.clientX - r.left;
            mouseY = e.clientY - r.top;
            for (let p of particles) {
                if (Math.hypot(p.x-mouseX, p.y-mouseY) < R+12) { dragged = p; return; }
            }
        });
        canvas.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            mouseX = e.clientX - r.left;
            mouseY = e.clientY - r.top;
        });
        window.addEventListener('mouseup', () => dragged = null);

        // Controls
        document.getElementById('substance-select').addEventListener('change', e => {
            substance = substances[e.target.value];
            updateMetrics();
        });
        document.getElementById('num-slider').addEventListener('input', e => updateMoleculeCount(+e.target.value));
        document.getElementById('temp-slider').addEventListener('input', e => setTemperature(+e.target.value));

        function togglePause() {
            paused = !paused;
            const b = document.getElementById('pause-btn');
            document.getElementById('pause-icon').textContent = paused ? "▶" : "❚❚";
            document.getElementById('pause-text').textContent = paused ? "PLAY" : "PAUSE";
        }

        window.resetSimulation = function() {
            currentTemp = 25;
            document.getElementById('temp-slider').value = 25;
            setTemperature(25);
            updateMoleculeCount(80);
            document.getElementById('num-slider').value = 80;
            particles.forEach(p => { 
                p.vx = (Math.random()-0.5)*4.5; 
                p.vy = (Math.random()-0.5)*4.5; 
            });
            paused = false;
            document.getElementById('pause-icon').textContent = "❚❚";
            document.getElementById('pause-text').textContent = "PAUSE";
        };

        window.onload = () => {
            canvas.width = W; canvas.height = H;
            initParticles(80);
            updateMetrics();
            animate();
        };
    </script>
</body>
</html>
