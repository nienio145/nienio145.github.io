<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecular Phase Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a12; --surface: rgba(255,255,255,0.03); --surface2: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08); --cyan: #00e5ff; --text: #c8d4e8;
    --text-dim: #4a5a73; --text-bright: #eef2f8; --solid: #5b9cf6;
    --liquid: #2dd4bf; --gas: #fb923c; --r: 12px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:24px 20px 40px;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025)1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
  .page{position:relative;z-index:1;max-width:1180px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;}
  .header-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--cyan);background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.25);padding:4px 12px;border-radius:20px;margin-bottom:12px;}
  h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-0.03em;color:var(--text-bright);}
  h1 em{font-style:normal;color:var(--cyan);}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:18px;}
  .left{display:flex;flex-direction:column;gap:14px;}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px 12px;position:relative;}
  .card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cyan);}
  .card.s::after{background:var(--solid);}.card.l::after{background:var(--liquid);}.card.g::after{background:var(--gas);}
  .card-lbl{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px;}
  .card-val{font-family:'Space Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--text-bright);}
  .card-val.sm{font-size:1.1rem;}
  .sim-wrap{background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
  canvas{display:block;border-radius:8px;border:1px solid var(--border);width:100%;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:sticky;top:20px;}
  .btn{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;cursor:pointer;transition:all .18s;}
  .btn:hover{background:rgba(0,229,255,0.1);border-color:rgba(0,229,255,0.5);color:var(--cyan);}
  .btn.active{background:rgba(0,229,255,0.15);border-color:rgba(0,229,255,0.6);color:var(--cyan);}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-badge">Thermodynamics Lab</div>
    <h1>Molecular <em>Phase</em> Simulator</h1>
    <p style="font-family:'Space Mono',monospace;font-size:0.65rem;color:#4a5a73;margin-top:8px;">Natural random crystalline freezing • Fully stable</p>
  </header>

  <div class="layout">
    <div class="left">
      <div class="metrics">
        <div class="card" id="c-temp"><div class="card-lbl">Temperature</div><div class="card-val" id="m-temp">25.0</div><div class="card-unit">°C</div></div>
        <div class="card" id="c-tempk"><div class="card-lbl">Temp (Kelvin)</div><div class="card-val" id="m-tempk">298</div><div class="card-unit">K</div></div>
        <div class="card" id="c-pres"><div class="card-lbl">Pressure</div><div class="card-val" id="m-pres">1.00</div><div class="card-unit">atm</div></div>
        <div class="card" id="c-phase"><div class="card-lbl">Phase</div><div class="card-val sm" id="m-phase">Liquid</div><div class="card-unit" id="m-mol-count">50 molecules</div></div>
      </div>
      <div class="sim-wrap">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
          <span style="font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.13em;color:#4a5a73;">Simulation Container</span>
          <span id="phase-pill" style="font-family:'Space Mono',monospace;font-size:0.65rem;font-weight:700;letter-spacing:0.1em;padding:3px 10px;border-radius:20px;background:rgba(45,212,191,0.18);color:#2dd4bf;border:1px solid rgba(45,212,191,0.35);">Liquid</span>
        </div>
        <canvas id="sim"></canvas>
      </div>
    </div>

    <div class="panel">
      <div style="font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:#4a5a73;margin-bottom:18px;">⚗ Simulation Controls</div>

      <div style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-size:0.82rem;font-weight:600;">Substance</span></div>
        <select id="sel-substance" style="width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 12px;font-size:0.82rem;">
          <option value="water">Water (H₂O)</option>
          <option value="ethanol">Ethanol (C₂H₅OH)</option>
          <option value="co2">Carbon Dioxide (CO₂)</option>
          <option value="iron">Iron (Fe)</option>
        </select>
        <div id="sub-info" style="background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.1);border-radius:8px;padding:10px 12px;margin-top:10px;font-family:'Space Mono',monospace;font-size:0.63rem;color:#4a5a73;line-height:1.8;"></div>
      </div>

      <div style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-size:0.82rem;font-weight:600;">Temperature</span><span id="lbl-temp" style="font-family:'Space Mono',monospace;color:#00e5ff;">25 °C</span></div>
        <input type="range" id="sl-temp" min="-200" max="3200" value="25" step="1" style="width:100%;">
      </div>

      <div style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-size:0.82rem;font-weight:600;">Molecules</span><span id="lbl-mol" style="font-family:'Space Mono',monospace;color:#00e5ff;">50</span></div>
        <input type="range" id="sl-mol" min="10" max="150" value="50" step="1" style="width:100%;">
      </div>

      <div style="margin-top:14px;padding:10px 12px;background:rgba(255,255,255,0.06);border-radius:8px;border:1px solid var(--border);">
        <div style="font-family:'Space Mono',monospace;font-size:0.58rem;display:flex;justify-content:space-between;margin-bottom:7px;color:#4a5a73;">
          <span>Avg Particle Speed</span><span id="speed-val">2.34 px/f</span>
        </div>
        <div style="height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;">
          <div id="speed-bar" style="height:100%;width:35%;background:#2dd4bf;transition:width .15s,background .4s;"></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px;">
        <button class="btn" id="btn-pause">⏸ Pause</button>
        <button class="btn" id="btn-reset">↺ Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUBS = {
  water:   { melt: 0,   boil: 100 },
  ethanol: { melt: -114, boil: 78.4 },
  co2:     { melt: -78.5, boil: -56.6 },
  iron:    { melt: 1538, boil: 2862 }
};

const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const CW = 640, CH = 400;
canvas.width = CW; canvas.height = CH;
const R = 9;

let particles = [], lattice = [], latticeJitter = [];
let temperature = 25, numMol = 50, subKey = 'water', paused = false;
let phaseBlend = 0, vaporBlend = 0;

function buildLattice(n) {
  const pts = [];
  const spacing = R * 2.45;
  const rowH = spacing * Math.sqrt(3) / 2;
  const padX = 32, padY = 28;
  const cols = Math.floor((CW - padX*2) / spacing) + 1;
  let row = 0, col = 0;
  for (let i = 0; i < n; i++) {
    const offset = (row % 2 === 0) ? 0 : spacing / 2;
    const x = padX + offset + col * spacing;
    const y = CH - padY - row * rowH;
    pts.push({x, y});
    col++;
    if (col >= cols || x + R > CW - padX) { col = 0; row++; }
  }
  return pts;
}

function initSimulation() {
  lattice = buildLattice(numMol);
  latticeJitter = lattice.map(() => ({
    x: (Math.random()-0.5)*7, y: (Math.random()-0.5)*7,
    vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35
  }));

  particles = [];
  for (let i = 0; i < numMol; i++) {
    particles.push({
      x: R + Math.random()*(CW-2*R),
      y: R + Math.random()*(CH*0.6),
      vx: (Math.random()-0.5)*3,
      vy: (Math.random()-0.5)*3,
      latticeIdx: i
    });
  }
}

function getPhase() {
  const s = SUBS[subKey];
  if (temperature < s.melt) return 'solid';
  if (temperature < s.boil) return 'liquid';
  return 'gas';
}

function getSolidFactor() {
  const s = SUBS[subKey];
  const val = (s.melt + 11 - temperature) / 22;
  return Math.max(0, Math.min(1, val));
}

function getLiquidFactor() {
  const s = SUBS[subKey];
  const val = (s.boil + 7 - temperature) / 14;
  return Math.max(0, Math.min(1, val));
}

function getTempK() { return Math.max(1, temperature + 273.15); }

function update() {
  if (paused) return;

  // Safe sync when molecule count changes
  if (lattice.length !== numMol) {
    lattice = buildLattice(numMol);
    latticeJitter = lattice.map(() => ({
      x: (Math.random()-0.5)*7, y: (Math.random()-0.5)*7,
      vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35
    }));
    particles.forEach((p, i) => p.latticeIdx = Math.min(i, lattice.length-1));
    while (particles.length < numMol) particles.push({x:CW/2, y:CH/2, vx:0, vy:0, latticeIdx:particles.length});
    while (particles.length > numMol) particles.pop();
  }

  const sf = getSolidFactor();
  const lf = getLiquidFactor();
  phaseBlend = phaseBlend * 0.982 + sf * 0.018;
  vaporBlend = vaporBlend * 0.965 + (1 - lf) * 0.035;

  // Evolve jitter for natural crystals
  latticeJitter.forEach(j => {
    j.vx += (Math.random()-0.5)*0.09;
    j.vy += (Math.random()-0.5)*0.09;
    j.vx *= 0.91; j.vy *= 0.91;
    j.x = Math.max(-9, Math.min(9, j.x + j.vx));
    j.y = Math.max(-9, Math.min(9, j.y + j.vy));
  });

  for (let p of particles) {
    const base = lattice[p.latticeIdx] || lattice[0];
    const jit = latticeJitter[p.latticeIdx] || latticeJitter[0];
    const tx = base.x + jit.x;
    const ty = base.y + jit.y;

    if (phaseBlend > 0.005) {
      const dx = tx - p.x, dy = ty - p.y;
      const stiffness = phaseBlend * phaseBlend * 0.26;
      let fx = dx * stiffness, fy = dy * stiffness;
      const maxF = 2.9 * Math.sqrt(phaseBlend);
      fx = Math.max(-maxF, Math.min(maxF, fx));
      fy = Math.max(-maxF, Math.min(maxF, fy));
      p.vx += fx; p.vy += fy;

      const damp = Math.max(0.52, 0.87 - phaseBlend * 0.29);
      p.vx *= damp; p.vy *= damp;

      const jitStr = (1 - phaseBlend) * 1.15;
      p.vx += (Math.random()-0.5) * jitStr;
      p.vy += (Math.random()-0.5) * jitStr;
    }

    if (phaseBlend < 0.92) {
      const liq = 1 - vaporBlend;
      p.vy += 0.19 * liq + ((phaseBlend > 0.02 && phaseBlend < 0.85) ? 0.25*(1-phaseBlend) : 0);
      const d = 0.998 + vaporBlend * 0.002;
      p.vx *= d; p.vy *= d;
      if (vaporBlend > 0.03) {
        const gj = 6 * Math.sqrt(getTempK()/373) * 0.055 * vaporBlend;
        p.vx += (Math.random()-0.5)*gj;
        p.vy += (Math.random()-0.5)*gj;
      }
    }
  }

  // Thermostat
  let mean = 0;
  for (let p of particles) mean += Math.hypot(p.vx, p.vy);
  mean /= particles.length || 1;

  const target = (phaseBlend > 0.75) ? 0.28 :
    (2.2*Math.sqrt(getTempK()/298)*(1-vaporBlend) + 6*Math.sqrt(getTempK()/373)*vaporBlend) * (1 - phaseBlend*0.4);

  if (mean > 0.01) {
    const sc = Math.max(0.65, Math.min(1.9, 1 + (target/mean - 1)*0.04));
    for (let p of particles) { p.vx *= sc; p.vy *= sc; }
  }

  // Move + walls
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < R) { p.x = R; p.vx = Math.abs(p.vx); }
    if (p.x > CW - R) { p.x = CW - R; p.vx = -Math.abs(p.vx); }
    if (p.y < R) { p.y = R; p.vy = Math.abs(p.vy); }
    if (p.y > CH - R) { p.y = CH - R; p.vy = -Math.abs(p.vy); }
  }

  // Particle collisions (only when not mostly solid)
  if (phaseBlend < 0.92) {
    const len = particles.length;
    for (let i = 0; i < len; i++) {
      for (let j = i + 1; j < len; j++) {
        const a = particles[i], b = particles[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < 4*R*R && d2 > 0) {
          const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
          const overlap = 2*R - d;
          a.x -= nx*overlap*0.5; a.y -= ny*overlap*0.5;
          b.x += nx*overlap*0.5; b.y += ny*overlap*0.5;
          const dot = (a.vx - b.vx)*nx + (a.vy - b.vy)*ny;
          if (dot > 0) {
            a.vx -= dot*nx; a.vy -= dot*ny;
            b.vx += dot*nx; b.vy += dot*ny;
          }
        }
      }
    }
  }
}

function draw() {
  const phase = getPhase();
  const col = phase === 'solid' ? '#5b9cf6' : phase === 'liquid' ? '#2dd4bf' : '#fb923c';
  const gcolBase = phase === 'solid' ? 'rgba(91,156,246,' : phase === 'liquid' ? 'rgba(45,212,191,' : 'rgba(251,146,60,';

  const grad = ctx.createLinearGradient(0,0,0,CH);
  grad.addColorStop(0, phase==='solid'?'#08101e':phase==='liquid'?'#06111a':'#141008');
  grad.addColorStop(1, phase==='solid'?'#060d1a':phase==='liquid'?'#061410':'#080a06');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,CW,CH);

  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  for (let x=48; x<CW; x+=48) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
  for (let y=48; y<CH; y+=48) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }

  const alpha = Math.min(1, phaseBlend * 2.4);
  if (alpha > 0.02) {
    ctx.lineWidth = 1;
    const len = particles.length;
    for (let i = 0; i < len; i++) {
      for (let j = i+1; j < len; j++) {
        const a = particles[i], b = particles[j];
        const d2 = (b.x-a.x)**2 + (b.y-a.y)**2;
        if (d2 < (R*3.3)**2) {
          const d = Math.sqrt(d2);
          const stretch = Math.abs(d - R*2.45) / (R*2.45);
          const ba = Math.max(0, 0.38 - stretch*0.7) * alpha;
          ctx.strokeStyle = `rgba(91,156,246,${ba})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
  }

  for (let p of particles) {
    const gr = ctx.createRadialGradient(p.x, p.y, R*0.4, p.x, p.y, R*2.8);
    gr.addColorStop(0, gcolBase + '0.35)');
    gr.addColorStop(1, gcolBase + '0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(p.x, p.y, R*2.8, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(p.x - R*0.3, p.y - R*0.32, R*0.32, 0, Math.PI*2); ctx.fill();
  }
}

function updateUI() {
  const phase = getPhase();
  document.getElementById('m-temp').textContent = temperature.toFixed(1);
  document.getElementById('m-tempk').textContent = getTempK().toFixed(0);
  document.getElementById('m-pres').textContent = ((particles.length * getTempK()) / (50 * 298)).toFixed(2);
  document.getElementById('m-phase').textContent = phase.charAt(0).toUpperCase() + phase.slice(1);
  document.getElementById('m-mol-count').textContent = particles.length + ' molecules';

  const pill = document.getElementById('phase-pill');
  pill.style.background = phase==='solid' ? 'rgba(91,156,246,0.18)' : phase==='liquid' ? 'rgba(45,212,191,0.18)' : 'rgba(251,146,60,0.18)';
  pill.style.color = phase==='solid' ? '#5b9cf6' : phase==='liquid' ? '#2dd4bf' : '#fb923c';
  pill.style.borderColor = phase==='solid' ? 'rgba(91,156,246,0.35)' : phase==='liquid' ? 'rgba(45,212,191,0.35)' : 'rgba(251,146,60,0.35)';
  pill.textContent = phase.charAt(0).toUpperCase() + phase.slice(1);

  let spd = 0;
  for (let p of particles) spd += Math.hypot(p.vx, p.vy);
  spd /= particles.length || 1;
  const pct = Math.min(100, (spd / 9) * 100);
  document.getElementById('speed-bar').style.width = pct + '%';
  document.getElementById('speed-bar').style.background = phase==='solid'?'#5b9cf6':phase==='liquid'?'#2dd4bf':'#fb923c';
  document.getElementById('speed-val').textContent = spd.toFixed(2) + ' px/f';
}

function updateSubInfo() {
  const s = SUBS[subKey];
  document.getElementById('sub-info').innerHTML = 
    `<b>Melts at:</b> ${s.melt} °C &nbsp;|&nbsp; <b>Boils at:</b> ${s.boil} °C`;
}

// Event listeners
document.getElementById('sl-temp').addEventListener('input', e => {
  temperature = +e.target.value;
  document.getElementById('lbl-temp').textContent = temperature + ' °C';
});

document.getElementById('sl-mol').addEventListener('input', e => {
  numMol = +e.target.value;
  document.getElementById('lbl-mol').textContent = numMol;
});

document.getElementById('sel-substance').addEventListener('change', e => {
  subKey = e.target.value;
  updateSubInfo();
});

document.getElementById('btn-pause').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? '▶ Play' : '⏸ Pause';
  this.classList.toggle('active', paused);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  temperature = 25; numMol = 50; paused = false; phaseBlend = 0; vaporBlend = 0;
  document.getElementById('sl-temp').value = 25;
  document.getElementById('sl-mol').value = 50;
  document.getElementById('lbl-temp').textContent = '25 °C';
  document.getElementById('lbl-mol').textContent = '50';
  document.getElementById('btn-pause').textContent = '⏸ Pause';
  document.getElementById('btn-pause').classList.remove('active');
  initSimulation();
});

function loop() {
  update();
  draw();
  updateUI();
  requestAnimationFrame(loop);
}

// Initialize
updateSubInfo();
initSimulation();
loop();
</script>
</body>
</html>
