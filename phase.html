<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Phase Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --bg: #0f172a;
            --panel: #1e2937;
            --accent: #22d3ee;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: 'Inter', system_ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .app {
            width: 1000px;
            background: #1e2937;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(90deg, #22d3ee, #06b6d4);
            color: #0f172a;
            padding: 16px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.5px;
        }
        
        .main {
            display: flex;
            padding: 24px;
            gap: 24px;
            background: #0f172a;
        }
        
        canvas {
            background: #1e2937;
            border: 12px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            cursor: grab;
        }
        
        .sidebar {
            width: 280px;
            background: var(--panel);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: inset 0 2px 4px rgb(0 0 0 / 0.1);
        }
        
        .metric {
            background: #0f172a;
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
        }
        
        .metric strong {
            color: #94a3b8;
            font-weight: 500;
        }
        
        .metric span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--accent);
        }
        
        .controls {
            padding: 24px;
            background: #1e2937;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        .control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        label {
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 500;
        }
        
        select, input[type="range"] {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }
        
        input[type="range"] {
            accent-color: #22d3ee;
        }
        
        .value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            color: #22d3ee;
            text-align: right;
            min-width: 48px;
        }
        
        .buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #pauseBtn {
            background: #334155;
            color: white;
        }
        
        #pauseBtn:hover {
            background: #475569;
        }
        
        #resetBtn {
            background: #ef4444;
            color: white;
        }
        
        #resetBtn:hover {
            background: #f87171;
        }
        
        .phase {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            padding: 8px;
            border-radius: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>Molecular Phase Simulator</header>
        
        <div class="main">
            <!-- Canvas -->
            <canvas id="canvas" width="620" height="420"></canvas>
            
            <!-- Metrics Dashboard -->
            <div class="sidebar">
                <div style="text-align:center; margin-bottom:8px;">
                    <span id="phaseDisplay" class="phase" style="background:#1e2937; color:#22d3ee;">LIQUID</span>
                </div>
                
                <div class="metric">
                    <strong>Temperature</strong>
                    <span id="tempDisplay">25.0</span>
                    <span style="font-size:0.95rem; color:#64748b;">°C</span>
                </div>
                
                <div class="metric">
                    <strong>Pressure</strong>
                    <span id="pressureDisplay">1.00</span>
                    <span style="font-size:0.95rem; color:#64748b;">atm</span>
                </div>
                
                <div class="metric">
                    <strong>Specific Heat</strong>
                    <span id="shDisplay">4.18</span>
                    <span style="font-size:0.95rem; color:#64748b;">J/g·K</span>
                </div>
                
                <div class="metric">
                    <strong>Total Energy</strong>
                    <span id="energyDisplay">13400</span>
                    <span style="font-size:0.95rem; color:#64748b;">J</span>
                </div>
                
                <div class="metric">
                    <strong>Molecules</strong>
                    <span id="numDisplay">50</span>
                </div>
                
                <div style="margin-top:auto; font-size:0.85rem; color:#64748b; text-align:center;">
                    Drag balls • Slide controls • Watch phases change instantly
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <div class="control">
                <label for="substance">Substance</label>
                <select id="substance">
                    <option value="Water">Water</option>
                    <option value="Ethanol">Ethanol</option>
                    <option value="CO2">CO₂</option>
                    <option value="Iron">Iron</option>
                </select>
            </div>
            
            <div class="control">
                <label for="numSlider">Molecules <span id="numVal" class="value">50</span></label>
                <input type="range" id="numSlider" min="20" max="200" value="50" step="1">
            </div>
            
            <div class="control">
                <label for="tempSlider">Temperature (°C) <span id="tempVal" class="value">25</span></label>
                <input type="range" id="tempSlider" min="-100" max="300" value="25" step="0.5">
            </div>
            
            <div class="control">
                <label for="heatSlider">Heat Rate (J/s) <span id="heatVal" class="value">0</span></label>
                <input type="range" id="heatSlider" min="-200" max="200" value="0" step="1">
            </div>
            
            <div class="buttons">
                <button id="pauseBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // ============== CONFIG ==============
        const canvas = document.getElementById('canvas')
        const ctx = canvas.getContext('2d')
        
        const substances = {
            Water:   { melt: 0,    boil: 100,  sh: 4.184 },
            Ethanol: { melt: -114, boil: 78,   sh: 2.44 },
            CO2:     { melt: -78.5,boil: -56.6,sh: 0.85 },
            Iron:    { melt: 1538, boil: 2862, sh: 0.449 }
        }
        
        const phaseColors = {
            Solid:  '#3b82f6',
            Liquid: '#14b8a6',
            Gas:    '#f59e0b'
        }
        
        // ============== STATE ==============
        let particles = []
        let currentTemp = 25
        let heatRate = 0
        let numMolecules = 50
        let isPlaying = true
        let currentSubstance = 'Water'
        let meltPoint = 0
        let boilPoint = 100
        let specificHeat = 4.184
        let currentPhase = 'Liquid'
        let selectedParticle = null
        
        const RADIUS = 9
        
        // ============== HELPERS ==============
        function addParticle() {
            particles.push({
                x: 40 + Math.random() * (canvas.width - 80),
                y: 40 + Math.random() * (canvas.height - 80),
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3
            })
        }
        
        function removeParticles(count) {
            if (particles.length > count) {
                particles.splice(count)
            }
        }
        
        function calculatePhase(t) {
            if (t < meltPoint) return 'Solid'
            if (t < boilPoint) return 'Liquid'
            return 'Gas'
        }
        
        function calculatePressure() {
            const kelvin = currentTemp + 273
            return (numMolecules / 100 * kelvin / 300).toFixed(2)
        }
        
        function updateMetrics() {
            document.getElementById('tempDisplay').textContent = currentTemp.toFixed(1)
            document.getElementById('pressureDisplay').textContent = calculatePressure()
            document.getElementById('shDisplay').textContent = specificHeat.toFixed(2)
            document.getElementById('energyDisplay').textContent = Math.round(numMolecules * specificHeat * (currentTemp + 273))
            document.getElementById('numDisplay').textContent = numMolecules
            
            const phaseEl = document.getElementById('phaseDisplay')
            phaseEl.textContent = currentPhase.toUpperCase()
            phaseEl.style.color = phaseColors[currentPhase] || '#22d3ee'
        }
        
        // ============== PHYSICS ==============
        function updatePhysics() {
            if (!isPlaying) return
            
            // Apply heat rate
            const capacity = numMolecules * specificHeat
            if (capacity > 0) {
                const dT = heatRate / capacity / 60
                currentTemp += dT
            }
            currentTemp = Math.max(-200, Math.min(500, currentTemp))
            
            // Update phase
            currentPhase = calculatePhase(currentTemp)
            
            const w = canvas.width
            const h = canvas.height
            
            // Update each molecule
            for (let p of particles) {
                p.x += p.vx
                p.y += p.vy
                
                // Wall collisions with slight energy loss
                if (p.x < RADIUS) { p.x = RADIUS; p.vx = -p.vx * 0.92 }
                if (p.x > w - RADIUS) { p.x = w - RADIUS; p.vx = -p.vx * 0.92 }
                if (p.y < RADIUS) { p.y = RADIUS; p.vy = -p.vy * 0.92 }
                if (p.y > h - RADIUS) { p.y = h - RADIUS; p.vy = -p.vy * 0.92 }
                
                // Phase-dependent damping
                let damping = 0.985
                if (currentPhase === 'Solid') damping = 0.88
                if (currentPhase === 'Gas') damping = 1.005
                p.vx *= damping
                p.vy *= damping
                
                // Temperature-based speed scaling (visual kinetic energy)
                let speed = Math.hypot(p.vx, p.vy)
                if (speed > 0) {
                    let targetSpeed = 1.8 + currentTemp * 0.018
                    if (currentPhase === 'Solid') targetSpeed *= 0.22
                    if (currentPhase === 'Gas') targetSpeed *= 1.8
                    targetSpeed = Math.max(0.3, Math.min(18, targetSpeed))
                    p.vx = (p.vx / speed) * targetSpeed
                    p.vy = (p.vy / speed) * targetSpeed
                }
            }
            
            // Particle-particle elastic collisions
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i]
                    const b = particles[j]
                    
                    const dx = b.x - a.x
                    const dy = b.y - a.y
                    const distSq = dx * dx + dy * dy
                    const minDist = RADIUS * 2
                    
                    if (distSq < minDist * minDist && distSq > 0.001) {
                        const dist = Math.sqrt(distSq)
                        const nx = dx / dist
                        const ny = dy / dist
                        
                        // Position correction
                        const overlap = minDist - dist
                        a.x -= overlap * nx * 0.5
                        a.y -= overlap * ny * 0.5
                        b.x += overlap * nx * 0.5
                        b.y += overlap * ny * 0.5
                        
                        // Velocity collision
                        const dvx = a.vx - b.vx
                        const dvy = a.vy - b.vy
                        let dot = dvx * nx + dvy * ny
                        
                        // Only collide if approaching
                        if (dot > 0) continue
                        
                        a.vx -= dot * nx
                        a.vy -= dot * ny
                        b.vx += dot * nx
                        b.vy += dot * ny
                    }
                }
            }
            
            updateMetrics()
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height)
            
            // Beaker background
            ctx.fillStyle = '#1e2937'
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            
            // Beaker walls
            ctx.strokeStyle = '#475569'
            ctx.lineWidth = 18
            ctx.strokeRect(18, 18, canvas.width - 36, canvas.height - 36)
            
            // Inner glow
            ctx.strokeStyle = '#334155'
            ctx.lineWidth = 4
            ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48)
            
            // Molecules
            const color = phaseColors[currentPhase]
            ctx.fillStyle = color
            ctx.strokeStyle = '#0f172a'
            ctx.lineWidth = 2.5
            
            for (let p of particles) {
                ctx.beginPath()
                ctx.arc(p.x, p.y, RADIUS, 0, Math.PI * 2)
                ctx.fill()
                ctx.stroke()
            }
            
            // Subtle temperature label inside beaker
            ctx.fillStyle = 'rgba(255,255,255,0.15)'
            ctx.font = 'bold 18px Space Grotesk'
            ctx.textAlign = 'center'
            ctx.fillText(currentPhase, canvas.width / 2, 48)
        }
        
        function gameLoop() {
            updatePhysics()
            draw()
            requestAnimationFrame(gameLoop)
        }
        
        // ============== INTERACTION ==============
        function initParticles(count) {
            particles = []
            for (let i = 0; i < count; i++) {
                addParticle()
            }
        }
        
        // Mouse drag
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect()
            const mx = e.clientX - rect.left
            const my = e.clientY - rect.top
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i]
                const dx = p.x - mx
                const dy = p.y - my
                if (dx * dx + dy * dy < (RADIUS + 8) * (RADIUS + 8)) {
                    selectedParticle = i
                    p.vx = 0
                    p.vy = 0
                    return
                }
            }
        })
        
        canvas.addEventListener('mousemove', e => {
            if (selectedParticle === null) return
            const rect = canvas.getBoundingClientRect()
            const mx = e.clientX - rect.left
            const my = e.clientY - rect.top
            const p = particles[selectedParticle]
            p.x = Math.max(RADIUS, Math.min(canvas.width - RADIUS, mx))
            p.y = Math.max(RADIUS, Math.min(canvas.height - RADIUS, my))
        })
        
        window.addEventListener('mouseup', () => {
            selectedParticle = null
        })
        
        // ============== UI CONTROLS ==============
        document.getElementById('substance').addEventListener('change', e => {
            currentSubstance = e.target.value
            const s = substances[currentSubstance]
            meltPoint = s.melt
            boilPoint = s.boil
            specificHeat = s.sh
            currentPhase = calculatePhase(currentTemp)
            updateMetrics()
        })
        
        const numSlider = document.getElementById('numSlider')
        numSlider.addEventListener('input', () => {
            const target = parseInt(numSlider.value)
            document.getElementById('numVal').textContent = target
            if (target > particles.length) {
                for (let i = particles.length; i < target; i++) addParticle()
            } else if (target < particles.length) {
                removeParticles(target)
            }
            numMolecules = target
            updateMetrics()
        })
        
        const tempSlider = document.getElementById('tempSlider')
        tempSlider.addEventListener('input', () => {
            currentTemp = parseFloat(tempSlider.value)
            document.getElementById('tempVal').textContent = currentTemp.toFixed(1)
            currentPhase = calculatePhase(currentTemp)
            updateMetrics()
        })
        
        const heatSlider = document.getElementById('heatSlider')
        heatSlider.addEventListener('input', () => {
            heatRate = parseFloat(heatSlider.value)
            document.getElementById('heatVal').textContent = heatRate
        })
        
        document.getElementById('pauseBtn').addEventListener('click', () => {
            isPlaying = !isPlaying
            document.getElementById('pauseBtn').textContent = isPlaying ? 'Pause' : 'Play'
        })
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            currentTemp = 25
            heatRate = 0
            currentSubstance = 'Water'
            const s = substances.Water
            meltPoint = s.melt
            boilPoint = s.boil
            specificHeat = s.sh
            
            document.getElementById('substance').value = 'Water'
            tempSlider.value = 25
            heatSlider.value = 0
            numSlider.value = 50
            document.getElementById('tempVal').textContent = '25'
            document.getElementById('heatVal').textContent = '0'
            document.getElementById('numVal').textContent = '50'
            
            initParticles(50)
            numMolecules = 50
            currentPhase = calculatePhase(currentTemp)
            updateMetrics()
        })
        
        // ============== START ==============
        function startSimulator() {
            // Initial state
            document.getElementById('substance').value = 'Water'
            initParticles(50)
            updateMetrics()
            
            // Kick off loop
            gameLoop()
        }
        
        startSimulator()
    </script>
</body>
</html>
